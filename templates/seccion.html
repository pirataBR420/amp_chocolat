
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMP Chocolate | {{ titulo }}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf7;
            color: #46342e;
        }

        header {
            background: #e9a18b;
            color: white;
            padding: 24px 7%;
        }

        main {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .tarjeta {
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 3px 12px #00000010;
        }

        .boton {
            display: inline-block;
            background: #d98268;
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>{{ titulo }}</h1>
        <p>AMP Chocolate · Sistema de inventario</p>
    </header>

    <main>
        <section class="tarjeta">
            <h2>Sección en desarrollo</h2>
            <p>{{ descripcion }}</p>
            <p>{{ siguiente }}</p>
            <a class="boton" href="{{ url_for('inicio') }}">Volver al inicio</a>
        </section>
    </main>
</body>
</html>
